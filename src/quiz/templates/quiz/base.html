<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quiz Lab03{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-50 via-sky-50 to-indigo-100 font-sans antialiased text-slate-800 flex flex-col">
    <nav class="sticky top-0 z-20 bg-white/80 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="mx-auto max-w-6xl px-4 sm:px-6">
            <div class="flex h-16 items-center justify-between">
                <a href="{% url 'quiz:exam_list' %}" class="flex items-center gap-2 group">
                    <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-violet-500 to-indigo-600 text-white shadow-md group-hover:shadow-lg transition-shadow">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M7 16H5a2 2 0 01-2-2V8a2 2 0 012-2h14a2 2 0 012 2v6a2 2 0 01-2 2h-2m-9-8h.01M9 8h.01" />
                        </svg>
                    </span>
                    <span class="text-lg font-bold bg-gradient-to-r from-violet-600 to-indigo-600 bg-clip-text text-transparent">QuizLab</span>
                </a>
                <div class="flex items-center gap-3">
                    <a href="{% url 'quiz:exam_list' %}"
                       class="rounded-lg px-4 py-2 text-sm font-medium text-slate-700 hover:bg-violet-50 hover:text-violet-700 transition-colors">
                        Inicio / Exámenes
                    </a>
                    <a href="/admin/"
                       class="rounded-lg bg-slate-800 px-4 py-2 text-sm font-medium text-white shadow hover:bg-slate-700 transition-colors">
                        Admin
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 w-full mx-auto max-w-6xl px-4 sm:px-6 py-8 sm:py-10">
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="rounded-lg border px-4 py-3 text-sm shadow-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-700{% else %}border-emerald-200 bg-emerald-50 text-emerald-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200 bg-white/70">
        <div class="mx-auto max-w-6xl px-4 sm:px-6 py-6 text-center text-sm text-slate-500">
            <p>Laboratorio 03 · Django Quiz — Aplicaciones Empresariales</p>
        </div>
    </footer>
</body>
</html>
